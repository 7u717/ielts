name: Deploy IELTS to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
        env:
          NUXT_APP_BASE_URL: /ielts/
          ORIGIN: https://7u717.github.io
      - run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYTHON'
          import json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          for attempt in range(12):
              try:
                  request = urllib.request.Request(base + '?verify=' + os.environ['GITHUB_SHA'], headers={'Cache-Control': 'no-cache'})
                  html = urllib.request.urlopen(request, timeout=20).read().decode()
                  manifest = json.load(urllib.request.urlopen(base + 'manifest.json?verify=' + os.environ['GITHUB_SHA'], timeout=20))
                  assert 'data-design="iue-r3"' in html
                  assert manifest['theme_color'] == '#000000'
                  print('Published app and manifest verified:', base)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PYTHON
